[package]
name = "ams"
version = "0.1.0"
description = "A native, fast, keyboard-first desktop app for writing Typst documents"
authors = ["Orpheus-21"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ams_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "datetime"] }

# `cargo test --workspace` must exercise the 100ms recompile-latency budget
# (Task 7) realistically: Typst's layout code is CPU-heavy enough that the
# default unoptimized test profile alone runs several times slower than a
# release build, making the budget meaningless. Optimizing just the `test`
# profile keeps `cargo build`/`pnpm tauri dev` iteration untouched.
[profile.test]
opt-level = 2

